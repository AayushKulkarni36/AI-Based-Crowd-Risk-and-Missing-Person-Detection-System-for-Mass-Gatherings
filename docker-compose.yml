version: '3.9'

services:
  # =========================================================================
  # DATABASE: PostgreSQL 15 with pgvector extension
  # =========================================================================
  db:
    image: pgvector/pgvector:pg15-latest
    container_name: crowdsafe-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: missing_persons
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/scripts/migrate.sql:/docker-entrypoint-initdb.d/10_migrate.sql
      - ./infra/scripts/seed.sql:/docker-entrypoint-initdb.d/20_seed.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crowdsafe-network
    restart: unless-stopped

  # =========================================================================
  # CACHE & JOB QUEUE: Redis 7
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: crowdsafe-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crowdsafe-network
    restart: unless-stopped

  # =========================================================================
  # BACKEND: Node.js Express API + Socket.io
  # =========================================================================
  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    container_name: crowdsafe-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: missing_persons
      DB_USER: postgres
      DB_PASSWORD: postgres123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      FACE_API_URL: http://face-api:5001
      FRONTEND_URL: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/results:/app/data/results
      - ./data/logs:/app/data/logs
    networks:
      - crowdsafe-network
    restart: unless-stopped

  # =========================================================================
  # FACE RECOGNITION API: FastAPI Microservice
  # =========================================================================
  face-api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.python
    container_name: crowdsafe-face-api
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: missing_persons
      DB_USER: postgres
      DB_PASSWORD: postgres123
    ports:
      - "5001:5001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5001/health" ]
      interval: 15s
      timeout: 10s
      retries: 5
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/results:/app/data/results
    networks:
      - crowdsafe-network
    restart: unless-stopped
    # GPU support (uncomment if running on NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

    # =========================================================================
    # FRONTEND: React + Vite development server
    # =========================================================================
  frontend:
    build:
      context: ./frontend_v2
      dockerfile: ../infra/docker/Dockerfile.frontend
    container_name: crowdsafe-frontend
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_SOCKET_URL: http://localhost:5000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5173/" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./frontend_v2/src:/app/src
      - ./frontend_v2/public:/app/public
    networks:
      - crowdsafe-network
    restart: unless-stopped
  # =========================================================================
  # NGINX: Reverse proxy (optional - use in production)
  # =========================================================================
  # nginx:
  #   image: nginx:alpine
  #   container_name: crowdsafe-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - backend
  #     - frontend
  #   networks:
  #     - crowdsafe-network

  # ============================================================================
  # VOLUMES
  # ============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  crowdsafe-network:
    driver: bridge
